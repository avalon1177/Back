name: PR Tests (Backend)

on:
  pull_request:
    branches: [ develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 .

      - name: Unit tests
        run: pytest tests/
