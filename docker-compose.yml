services:
  db:
    image: postgres:16
    container_name: marketplace_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: marketplace_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace_api
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES}
      AppBaseUrl: ${APP_BASE_URL}
      Minio__Endpoint: ${MINIO_ENDPOINT}
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
      Minio__Bucket: ${MINIO_BUCKET}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM}
      SmsUa__ApiKey: ${SMS_UA_API_KEY}
      SmsUa__Sender: ${SMS_UA_SENDER}
      LiqPay__PublicKey: ${LIQPAY_PUBLIC_KEY}
      LiqPay__PrivateKey: ${LIQPAY_PRIVATE_KEY}
      LiqPay__ServerUrl: ${LIQPAY_SERVER_URL}
      LiqPay__ResultUrl: ${FRONTEND_BASE_URL}/payment-result
      Frontend__BaseUrl: ${FRONTEND_BASE_URL}
    depends_on:
      - db
      - minio
    ports:
      - "5001:5001"
    volumes:
      - uploads:/app/uploads
volumes:
  pgdata:
  miniodata:
  uploads:
